<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2FA Generator</title>
    <link rel="icon" type="image/png" href="clown.png">
    <!-- Bootstrap CSS -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->

    <!-- jQuery -->

    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
    <!-- JSEncrypt for RSA -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsencrypt/3.3.2/jsencrypt.min.js"></script>
    <script src="rsa-crypto.js?v=2"></script>
    <style>
        body {
            background: #f5f7fa;
            color: #2c3e50;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;

        .container {
            max-width: 1200px;
        }
        h1 {
            color: #2c3e50;
            font-weight: 600;
            margin-bottom: 40px;
            font-size: 2rem;
        }
        .card {
            background: #ffffff;
            color: #2c3e50;
            border: 1px solid #e1e8ed;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);

        .card:hover {
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);

        }
        .card-header {
            background: #ffffff;
            border-bottom: 1px solid #e1e8ed;
            padding: 16px 20px;

        }

        .toast {

        .notice-toast.show {

        }
        .notice-toast a {

        }
        .notice-toast-close {
            background: none;

            cursor: pointer;
            font-size: 1.1rem;
            padding: 0;
            margin-left: auto;
            flex-shrink: 0;

        }
        .notice-toast-close:hover {

        }
        .group-header {
            background: #ffffff;
            border: 1px solid #e1e8ed;
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }
        .group-header:hover {

        }
        .group-title {
            color: #2c3e50;
            font-weight: 600;
            font-size: 1.2rem;
            margin: 0;
            display: flex;

        }
        .group-count {
            background: #3498db;

            padding: 4px 10px;

        .group-toggle {

        .group-items {

        .btn-password {
            background: #9b59b6;

        .modal-overlay {
            display: none;

        .modal-header {
            display: flex;

            margin-bottom: 20px;
        }
        .modal-title {
            color: #2c3e50;

        }
        .modal-close {
            background: none;

            font-size: 1.5rem;

            color: #7f8c8d;
            padding: 0;

        }
        .modal-close:hover {
            color: #2c3e50;
        }
        .file-input-wrapper {
            border: 2px dashed #e1e8ed;
            border-radius: 8px;

            transition: all 0.3s ease;
        }
        .file-input-wrapper:hover {

        }
        .file-input-wrapper input[type="file"] {
            display: none;
        }

            cursor: pointer;

        .decrypted-password {
            background: #ffffff;
            color: #2c3e50;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #e1e8ed;

            font-size: 1.2rem;

        .decrypted-password .label {
            font-size: 0.85rem;
            color: #7f8c8d;
            font-weight: 600;
            margin-bottom: 8px;
            display: block;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .decrypted-password .value {

        .security-warning {

        .support-button {
            position: fixed;
            right: 24px;
            bottom: 24px;
            z-index: 1500;
            border: none;
            border-radius: 999px;
            padding: 12px 18px;
            background: linear-gradient(135deg, #16a085 0%, #1abc9c 100%);
            color: #ffffff;
            font-weight: 700;
            box-shadow: 0 12px 30px rgba(22, 160, 133, 0.28);
            display: flex;

            gap: 8px;

        .support-button:hover {

            box-shadow: 0 16px 36px rgba(22, 160, 133, 0.34);

        .support-button i {

<body>
    <div class="container mt-5">
        <h1 class="text-center">Xác thực 2 bước</h1>
        
        <!-- Search Box -->
        <div class="card mb-4" style="max-width: 600px; margin: 0 auto 30px auto;">
            <div class="card-body" style="padding: 20px;">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <i class="fas fa-search" style="color: #7f8c8d; font-size: 1.2rem;"></i>
                    <input 
                        type="text" 
                        id="searchInput" 
                        placeholder="Nhập email hoặc username để tìm kiếm..." 
                        style="flex: 1; border: none; outline: none; font-size: 1rem; color: #2c3e50;"
                        autocomplete="off"
                    >
                    <button 
                        id="clearButton" 
                        onclick="clearSearch()" 
                        style="background: none; border: none; color: #95a5a6; cursor: pointer; display: none; padding: 5px;"
                    >
                        <i class="fas fa-times" style="font-size: 1.2rem;"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Search Results -->
        <div id="searchResults" style="text-align: center; color: #7f8c8d; padding: 40px 0;">
            <i class="fas fa-search" style="font-size: 3rem; margin-bottom: 15px; opacity: 0.3;"></i>
            <p style="font-size: 1.1rem;">Nhập email hoặc username để tìm kiếm account</p>
        </div>
        
        <div id="otp-list" class="mt-4" style="display: none;">
            <!-- OTP items will be inserted here -->
        </div>
    </div>

    <script src='totp.js?v=2'></script>
    <script>
        // Track which groups are expanded - load from localStorage
        const expandedGroups = new Set(JSON.parse(localStorage.getItem('expandedGroups') || '[]'));
        const revealedPasswords = new Set(JSON.parse(localStorage.getItem('revealedPasswords') || '[]'));
        let allData = {};
        let updateInterval = null;

        function saveExpandedState() {
            localStorage.setItem('expandedGroups', JSON.stringify([...expandedGroups]));
        }

        function saveRevealedPasswordsState() {
            localStorage.setItem('revealedPasswords', JSON.stringify([...revealedPasswords]));
        }

        async function loadData() {
            try {
                const response = await fetch('data.json');
                const data = await response.json();
                allData = data;
                return data;
            } catch (error) {
                console.error('Error loading data:', error);
                return {};
            }
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                showToast('Copied to clipboard!');
            }).catch(err => {
                console.error('Failed to copy: ', err);
                showToast('Failed to copy!');
            });
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        function generateOTP(secret) {
            const totp = new jsOTP.totp();
            return totp.getOtp(secret);
        }

        function getTimeRemaining() {
            const now = Math.floor(Date.now() / 1000);
            return 30 - (now % 30);
        }

        function getFavicon(url, size = 64) {
            try {
                const { hostname } = new URL(url);
                return `https://www.google.com/s2/favicons?domain=${hostname}&sz=${size}`;
            } catch {
                return `https://www.google.com/s2/favicons?domain=default&sz=${size}`;
            }
        }

        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function createPasswordValueId(account, groupName) {
            return `password-${`${groupName}-${account}`.toLowerCase().replace(/[^a-z0-9_-]/g, '-')}`;
        }

        function isActivePinned(config) {
            if (!config || !config.pinned) {
                return false;
            }

            const expired = (config.expired || '').trim();
            if (!expired) {
                return true;
            }

            const match = expired.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
            if (!match) {
                return false;
            }

            const day = Number(match[1]);
            const month = Number(match[2]);
            const year = Number(match[3]);
            const expiredDate = new Date(year, month - 1, day);
            const normalizedExpiredDate = new Date(year, month - 1, day);
            normalizedExpiredDate.setHours(23, 59, 59, 999);

            if (
                normalizedExpiredDate.getFullYear() !== year ||
                normalizedExpiredDate.getMonth() !== month - 1 ||
                normalizedExpiredDate.getDate() !== day
            ) {
                return false;
            }

            return new Date() <= normalizedExpiredDate;
        }

        function toggleRawPassword(button, valueId) {
            const valueElement = document.getElementById(valueId);
            if (!valueElement) {
                return;
            }

            const isRevealed = valueElement.dataset.revealed === 'true';
            if (isRevealed) {
                revealedPasswords.delete(valueId);
                valueElement.textContent = '*************';
                valueElement.dataset.revealed = 'false';
                button.innerHTML = '<i class="fas fa-eye"></i>';
            } else {
                revealedPasswords.add(valueId);
                valueElement.textContent = valueElement.dataset.passwordRaw || '';
                valueElement.dataset.revealed = 'true';
                button.innerHTML = '<i class="fas fa-eye-slash"></i>';
            }

            saveRevealedPasswordsState();
        }

        function toggleGroup(groupName) {
            const groupItems = document.getElementById(`group-${groupName}`);
            const groupToggle = document.getElementById(`toggle-${groupName}`);
            
            if (expandedGroups.has(groupName)) {
                expandedGroups.delete(groupName);
                groupItems.classList.remove('expanded');
                groupToggle.classList.remove('expanded');
            } else {
                expandedGroups.add(groupName);
                groupItems.classList.add('expanded');
                groupToggle.classList.add('expanded');
            }
            
            // Save state to localStorage
            saveExpandedState();
        }

        function renderOTPList(data) {
            const otpList = document.getElementById('otp-list');
            otpList.innerHTML = '';

            if (Object.keys(data).length === 0) {
                otpList.style.display = 'none';
                document.getElementById('searchResults').innerHTML = `
                    <i class="fas fa-search-minus" style="font-size: 3rem; margin-bottom: 15px; opacity: 0.3;"></i>
                    <p style="font-size: 1.1rem;">Không tìm thấy account nào</p>
                `;
                document.getElementById('searchResults').style.display = 'block';
                return;
            }

            document.getElementById('searchResults').style.display = 'none';
            otpList.style.display = 'block';

            // Group items by group field
            const groups = {};
            for (const [account, config] of Object.entries(data)) {
                if (config.type === 'totp' && (isActivePinned(config) || !config.hidden)) {
                    const groupName = config.group || 'Other';
                    if (!groups[groupName]) {
                        groups[groupName] = [];
                    }
                    groups[groupName].push({ account, config });
                }
            }

            // Render each group
            for (const [groupName, items] of Object.entries(groups)) {
                // Create group header
                const groupHeader = document.createElement('div');
                groupHeader.className = 'group-header';
                groupHeader.onclick = () => toggleGroup(groupName);
                groupHeader.innerHTML = `
                    <div class="group-title">
                        <i class="fas fa-folder"></i>
                        ${escapeHtml(groupName)}
                        <span class="group-count">${items.length}</span>
                    </div>
                    <i id="toggle-${groupName}" class="fas fa-chevron-down group-toggle ${expandedGroups.has(groupName) ? 'expanded' : ''}"></i>
                `;
                otpList.appendChild(groupHeader);

                // Create group items container
                const groupItemsDiv = document.createElement('div');
                groupItemsDiv.id = `group-${groupName}`;
                groupItemsDiv.className = `group-items ${expandedGroups.has(groupName) ? 'expanded' : ''}`;

                // Render items in group
                items
                    .slice()
                    .sort((left, right) => Number(isActivePinned(right.config)) - Number(isActivePinned(left.config)) || left.account.localeCompare(right.account))
                    .forEach(({ account, config }) => {
                        const otp = generateOTP(config.secret);
                        const timeRemaining = getTimeRemaining();
                        const progress = ((30 - timeRemaining) / 30) * 100;

                        const card = document.createElement('div');
                        card.className = 'card';
                        const progressBarClass = timeRemaining <= 5 ? 'progress-bar danger' : 'progress-bar';
                        
                        const faviconUrl = config.url ? getFavicon(config.url) : '';
                        const faviconHtml = faviconUrl ? `<img src="${faviconUrl}" class="favicon" alt="favicon">` : '<i class="fas fa-lock" style="font-size: 24px; margin-right: 12px; color: #95a5a6;"></i>';
                        
                        let credentialsHtml = '';
                        if (config.username || config.url) {
                            credentialsHtml = '<div style="padding: 0 20px 16px 20px;">';
                            
                            if (config.url) {
                                credentialsHtml += `
                                    <div class="credential-row">
                                        <span class="credential-label">URL</span>
                                        <span class="credential-value">
                                            <a href="${escapeHtml(config.url)}" target="_blank" class="btn-link">${escapeHtml(config.url)}</a>
                                        </span>
                                        <i class="fas fa-copy" onclick="copyToClipboard('${config.url.replace(/'/g, "\\'")}')"></i>
                                    </div>
                                `;
                            }
                            
                            if (config.username) {
                                credentialsHtml += `
                                    <div class="credential-row">
                                        <span class="credential-label">Username</span>
                                        <span class="credential-value">${escapeHtml(config.username)}</span>
                                        <i class="fas fa-copy" onclick="copyToClipboard('${config.username.replace(/'/g, "\\'")}')"></i>
                                    </div>
                                `;
                            }

                            if (config.password_raw) {
                                const passwordValueId = createPasswordValueId(account, groupName);
                                const isPasswordRevealed = revealedPasswords.has(passwordValueId);
                                credentialsHtml += `
                                    <div class="credential-row">
                                        <span class="credential-label">Password</span>
                                        <span class="credential-value" id="${passwordValueId}" data-password-raw="${escapeHtml(config.password_raw)}" data-revealed="${isPasswordRevealed ? 'true' : 'false'}">${isPasswordRevealed ? escapeHtml(config.password_raw) : '*************'}</span>
                                        <button class="btn-password" onclick="event.stopPropagation(); toggleRawPassword(this, '${passwordValueId}')">
                                            <i class="fas ${isPasswordRevealed ? 'fa-eye-slash' : 'fa-eye'}"></i>
                                        </button>
                                    </div>
                                `;
                            } else if (config.password) {
                                credentialsHtml += `
                                    <div class="credential-row">
                                        <span class="credential-label">Password</span>
                                        <span class="credential-value">••••••••</span>
                                        <button class="btn-password" onclick="event.stopPropagation(); showPasswordModal('${config.password.replace(/'/g, "\\'")}')">
                                            <i class="fas fa-eye"></i> Show
                                        </button>
                                    </div>
                                `;
                            }

                            credentialsHtml += '</div>';
                        }
                        
                        card.innerHTML = `
                            <div class="card-header">
                                ${faviconHtml}
                                <h5 class="card-title">${escapeHtml(account)}</h5>
                                <i class="fas fa-copy" onclick="copyToClipboard('${account.replace(/'/g, "\\'")}')"></i>
                            </div>
                            <div class="card-body">
                                ${credentialsHtml}
                                <div class="otp-display">
                                    ${otp}
                                    <i class="fas fa-copy" onclick="copyToClipboard('${otp}')" style="font-size: 1.5rem; margin-left: 15px;"></i>
                                </div>
                                <div class="progress">
                                    <div class="${progressBarClass}" role="progressbar" style="width: ${progress}%"></div>
                                </div>
                                <p class="time-remaining">Expires in ${timeRemaining} seconds</p>
                            </div>
                        `;
                        groupItemsDiv.appendChild(card);
                    });

                otpList.appendChild(groupItemsDiv);
            }
        }

        function searchAccounts(query) {
            const searchTerm = (query || '').trim().toLowerCase();
            const filteredData = {};

            if (!searchTerm) {
                for (const [account, config] of Object.entries(allData)) {
                    if (config.type === 'totp' && isActivePinned(config)) {
                        filteredData[account] = config;
                    }
                }

                if (Object.keys(filteredData).length === 0) {
                    document.getElementById('otp-list').style.display = 'none';
                    document.getElementById('searchResults').innerHTML = `
                    <i class="fas fa-search" style="font-size: 3rem; margin-bottom: 15px; opacity: 0.3;"></i>
                    <p style="font-size: 1.1rem;">Nhập email hoặc username để tìm kiếm account</p>
                `;
                    document.getElementById('searchResults').style.display = 'block';

                    if (updateInterval) {
                        clearInterval(updateInterval);
                        updateInterval = null;
                    }
                    return;
                }

                renderOTPList(filteredData);

                if (updateInterval) {
                    clearInterval(updateInterval);
                }
                updateInterval = setInterval(() => {
                    renderOTPList(filteredData);
                }, 1000);
                return;
            }

            for (const [account, config] of Object.entries(allData)) {
                const accountLower = account.toLowerCase();
                const usernameLower = (config.username || '').toLowerCase();

                if ((config.type === 'totp' && (isActivePinned(config) || !config.hidden)) && (accountLower.includes(searchTerm) || usernameLower.includes(searchTerm))) {
                    filteredData[account] = config;
                }
            }

            if (Object.keys(filteredData).length === 0) {
                document.getElementById('otp-list').style.display = 'none';
                document.getElementById('searchResults').innerHTML = `
                    <i class="fas fa-search-minus" style="font-size: 3rem; margin-bottom: 15px; opacity: 0.3;"></i>
                    <p style="font-size: 1.1rem;">Không tìm thấy account nào</p>
                `;
                document.getElementById('searchResults').style.display = 'block';

                if (updateInterval) {
                    clearInterval(updateInterval);
                    updateInterval = null;
                }
                return;
            }

            renderOTPList(filteredData);

            if (updateInterval) {
                clearInterval(updateInterval);
            }
            updateInterval = setInterval(() => {
                renderOTPList(filteredData);
            }, 1000);
        }

        function clearSearch() {
            const searchInput = document.getElementById('searchInput');
            searchInput.value = '';
            searchInput.focus();
            document.getElementById('clearButton').style.display = 'none';
            searchAccounts('');
        }

        async function init() {
            await loadData();
            
            // Setup search input
            const searchInput = document.getElementById('searchInput');
            const clearButton = document.getElementById('clearButton');
            
            searchInput.addEventListener('input', (e) => {
                const value = e.target.value;
                clearButton.style.display = value ? 'block' : 'none';
                searchAccounts(value);
            });
            
            searchInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    searchAccounts(e.target.value);
                }
            });

            searchAccounts('');
        }

        document.addEventListener('DOMContentLoaded', init);

        // Show notice toast on page load
        document.addEventListener('DOMContentLoaded', function () {
            const noticeToast = document.getElementById('noticeToast');
            setTimeout(() => noticeToast.classList.add('show'), 500);
        });

        // Password modal functions
        let currentEncryptedPassword = '';

        function showPasswordModal(encryptedPassword) {
            currentEncryptedPassword = encryptedPassword;
            document.getElementById('decryptResult').innerHTML = '';
            document.getElementById('privateKeyFile').value = '';
            document.getElementById('passwordModal').classList.add('show');
        }

        function closePasswordModal() {
            document.getElementById('passwordModal').classList.remove('show');
            currentEncryptedPassword = '';
        }

        function openSupportModal() {
            document.getElementById('supportModal').classList.add('show');
        }

        function closeSupportModal(event) {
            if (event && event.target !== event.currentTarget) {
                return;
            }

            document.getElementById('supportModal').classList.remove('show');
        }

        function handlePrivateKeyUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const privateKey = e.target.result;
                const decrypted = RSACrypto.decrypt(currentEncryptedPassword, privateKey);

                const resultDiv = document.getElementById('decryptResult');
                if (decrypted) {
                    resultDiv.innerHTML = `
                        <div class="decrypted-password">
                            <span class="label">Mật khẩu là:</span>
                            <span class="value">${escapeHtml(decrypted)}</span>
                            <i class="fas fa-copy" onclick="copyToClipboard('${decrypted.replace(/'/g, "\\'")}')" style="margin-left: 10px; cursor: pointer; color: #3498db;"></i>
                        </div>
                        <div class="security-warning">
                            <i class="fas fa-exclamation-triangle"></i>
                            Vui lòng không chia sẻ mật khẩu và khoá key cho người khác!
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = '<div class="error-message">Giải mã thất bại! Private key không đúng.</div>';
                }
            };
            reader.readAsText(file);
        }

        var passwordModal = document.getElementById('passwordModal');
        if(passwordModal) {
            passwordModal.addEventListener('click', function(e) {
                if (e.target === this) {
                    closePasswordModal();
                }
            });
        }
    </script>
    <div id="toast" class="toast"></div>

    <!-- Notice Toast
    <div id="noticeToast" class="notice-toast">
        <i class="fas fa-exclamation-triangle"></i>
        <span>Trang này sẽ ngừng hoạt động sau <strong>12/06/2026</strong>. Vui lòng truy cập trang mới <a href="https://app.dev8084.io.vn/" target="_blank">https://app.dev8084.io.vn/</a> để tiếp tục sử dụng. Xin cảm ơn!</span>
        <button class="notice-toast-close" onclick="document.getElementById('noticeToast').classList.remove('show')" title="Đóng">&times;</button>
    </div> -->

    <button class="support-button" onclick="openSupportModal()">
        <i class="fas fa-heart"></i>
        <span>Ủng hộ</span>
    </button>

    <div id="supportModal" class="modal-overlay" onclick="closeSupportModal(event)">
        <div class="modal-content support-modal-content" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3 class="modal-title">Ủng hộ tác giả</h3>
                <button class="modal-close" onclick="closeSupportModal()">&times;</button>
            </div>
            <img class="support-qr" src="https://img.vietqr.io/image/MB-40423456789-print.png" alt="QR chuyển khoản ủng hộ">
            <p class="support-note">Ủng hộ tác giả nếu bạn thấy tiện ích này hữu ích.</p>
        </div>
    </div>

    <!-- Password Modal -->
    <div id="passwordModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">Giải mã mật khẩu</h3>
                <button class="modal-close" onclick="closePasswordModal()">&times;</button>
            </div>
            <p style="color: #7f8c8d; margin-bottom: 15px;">Upload file private key (.pem) để giải mã mật khẩu</p>
            <div class="file-input-wrapper">
                <input type="file" id="privateKeyFile" accept=".pem,.txt" onchange="handlePrivateKeyUpload(event)">
                <label for="privateKeyFile">
                    <i class="fas fa-upload" style="font-size: 2rem; display: block; margin-bottom: 10px;"></i>
                    Chọn file private key
                </label>
            </div>
            <div id="decryptResult"></div>
        </div>
    </div>
</body>
</html>
